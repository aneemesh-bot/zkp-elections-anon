[package]
name = "vote_producer"
version = "0.1.0"
edition = "2021"

[dependencies]
crypto_primitives = { path = "../crypto_primitives" }
bulletproofs_core = { path = "../bulletproofs_core" }
k256 = { version = "0.13", features = ["arithmetic"] }
elliptic-curve = { version = "0.13", features = ["arithmetic"] }
rand = "0.8"
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
hex = "0.4"
