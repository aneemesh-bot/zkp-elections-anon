[package]
name = "bulletproofs_core"
version = "0.1.0"
edition = "2021"

[dependencies]
crypto_primitives = { path = "../crypto_primitives" }
k256 = { version = "0.13", features = ["arithmetic", "hash2curve"] }
elliptic-curve = { version = "0.13", features = ["arithmetic", "sec1"] }
sha2 = "0.10"
rand = "0.8"
rand_core = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
rand = "0.8"
